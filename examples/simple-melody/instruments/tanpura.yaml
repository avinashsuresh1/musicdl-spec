# instruments/tanpura.yaml
# We use a slight octave shift down so it acts as a deep backing drone
octave_shift: -1

harmonics:
  - { z: 1.0, amplitude: 1 }   # Fundamental tone (Deep, grounding body)
  - { z: 2.0, amplitude: 0.85 }  # 2nd Harmonic (Octave)
  - { z: 3.0, amplitude: 0.75 }  # 3rd Harmonic (Perfect 5th)
  - { z: 4.0, amplitude: 0.65 }  # 4th Harmonic (Double Octave)
  - { z: 5.0, amplitude: 0.50 }  # 5th Harmonic (Bright, shimmering edge)
  - { z: 6.0, amplitude: 0.40 }  # 6th Harmonic (Added buzz complexity)
  - { z: 7.0, amplitude: 0.25 }  # 7th Harmonic (The high-end metallic ring)

adsr:
  attack: 2     # Instantaneous pluck response of the finger
  decay: 400    # Initial volume drop as the pluck energy stabilizes
  sustain: 0.5  # The low level the string holds if it were left to vibrate
  release: 3000 # A long acoustic ring-out to replicate the hollow gourd resonance

